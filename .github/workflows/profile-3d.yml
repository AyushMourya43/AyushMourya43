name: Daily profile theme and heatmap

on:
  schedule:
    - cron: "47 18 * * *" # 00:17 IST; GitHub may start scheduled runs late.
  workflow_dispatch:
    inputs:
      theme:
        description: "auto = daily rotation; choose a theme to preview it now"
        type: choice
        default: auto
        options:
          - auto
          - blue-gold
          - burgundy-blue
          - olive-terracotta
          - cream-teal

permissions:
  contents: write

concurrency:
  group: profile-theme-and-heatmap
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install Pillow numpy CairoSVG

      - name: Apply today's profile theme
        env:
          THEME_CHOICE: ${{ inputs.theme || 'auto' }}
        run: python scripts/daily_theme.py profile --theme "$THEME_CHOICE"

      - name: Generate current contribution data
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: conf/github-profile-3d-contrib.json

      - name: Animate the fresh heatmap
        run: python scripts/animate_heatmap.py

      - name: Match the heatmap to today's theme
        run: python scripts/daily_theme.py heatmap

      - name: Commit the complete profile update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md profile-themes/ 01-hero.svg 02-about.gif 03-stack.svg 04-projects.gif 05-experience.gif 06-connect.gif link-email.svg link-linkedin.svg link-portfolio.svg profile-3d-contrib/profile-ayush.svg profile-3d-contrib/profile-ayush.gif
          if git diff --cached --quiet; then
            echo "Profile is already up to date."
          else
            git commit -m "Update daily profile theme and contribution heatmap"
            git push origin HEAD
          fi
