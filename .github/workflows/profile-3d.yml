name: Update animated contribution heatmap

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install Pillow CairoSVG

      - name: Generate the current contribution heatmap
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: conf/github-profile-3d-contrib.json

      - name: Create looping GIF from the latest SVG data
        run: python scripts/animate_heatmap.py

      - name: Commit updated SVG and GIF
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-3d-contrib/profile-ayush.svg profile-3d-contrib/profile-ayush.gif
          if git diff --cached --quiet; then
            echo "Heatmap is already up to date."
          else
            git commit -m "Update animated contribution heatmap"
            git push
          fi
